dependencies:
  idf:
    version: ">=5.5"

  espressif/ip101:
    version: "^1.1.0"
    rules:
    - if: "idf_version >=6.0"

  # The local BSP keeps the factory API while the managed board owns devices.

  espressif/esp_codec_dev:
    version: "2.0.0-beta5"
    public: true

  # Pin BSP transitive dependencies because the generated lock file is local.
  espressif/esp_lcd_touch_gt911:
    version: "1.2.1"

  espressif/esp_lvgl_adapter:
    version: "0.6.2"

  chmorgan/esp-audio-player:
    version: "1.1.0"
    public: true

  chmorgan/esp-file-iterator:
    version: "1.0.0"
    public: true

description: Project-specific extensions for ESP32-P4-WIFI6-Touch-LCD-4B
targets:
- esp32p4
version: 0.0.2
