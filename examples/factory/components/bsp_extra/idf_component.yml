dependencies:
  idf:
    version: ">=5.5"

  # The board BSP is overridden by the local component
  # examples/factory/components/esp32_p4_wifi6_touch_lcd_4b, which adds the JD9365DA
  # 720x720 panel used by the current screen. The Registry package
  # waveshare/esp32_p4_wifi6_touch_lcd_4b 3.0.1 must not be pulled in at the same time:
  # both components provide the same bsp/* headers and symbols.
  #
  # waveshare/esp32_p4_wifi6_touch_lcd_4b:
  #   version: "3.0.1"

  espressif/esp_codec_dev:
    version: "2.0.0-beta5"
    public: true

  # Pin BSP transitive dependencies because the generated lock file is local.
  espressif/esp_lcd_touch_gt911:
    version: "1.2.1"

  espressif/esp_lvgl_adapter:
    version: "0.6.2"

  chmorgan/esp-audio-player:
    version: "1.1.0"
    public: true

  chmorgan/esp-file-iterator:
    version: "1.0.0"
    public: true

description: Project-specific extensions for ESP32-P4-WIFI6-Touch-LCD-4B
targets:
- esp32p4
version: 0.0.2
