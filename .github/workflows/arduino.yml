name: Arduino Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      example:
        description: "all, a sketch name, or a repository-relative sketch path"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: arduino-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARDUINO_CORE_VERSION: "3.3.11"
  ARDUINO_GFX_VERSION: "1.6.6"
  LVGL_VERSION: "9.3.0"
  ESP32_PACKAGE_INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  ARDUINO_FQBN: >-
    esp32:esp32:esp32p4:UploadSpeed=921600,USBMode=default,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,FlashFreq=80,FlashMode=qio,FlashSize=32M,PartitionScheme=app13M_data7M_32MB,DebugLevel=none,PSRAM=enabled,EraseFlash=none,JTAGAdapter=default,ChipVariant=prev3

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.sketches.outputs.builds }}
      has_builds: ${{ steps.sketches.outputs.has_builds }}
      firmware_touched: ${{ steps.sketches.outputs.firmware_touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: sketches
        name: Route changed files to first-party sketches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_EXAMPLE: ${{ inputs.example || 'all' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/select_ci_targets.py \
              --framework arduino \
              --all \
              --requested "$REQUESTED_EXAMPLE"
            exit 0
          fi

          changed_file="$RUNNER_TEMP/arduino-name-status.z"
          if [[ -n "$BASE_SHA" ]] && \
             [[ ! "$BASE_SHA" =~ ^0+$ ]] && \
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-status -z "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
          else
            git diff-tree --root --no-commit-id --name-status -z -r "$HEAD_SHA" > "$changed_file"
          fi

          python scripts/select_ci_targets.py \
            --framework arduino \
            --changed-files-from "$changed_file"

  build:
    if: needs.discover.outputs.has_builds == 'true'
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.builds) }}
    name: ${{ matrix.sketch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - name: Install pinned platform and libraries
        shell: bash
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_PACKAGE_INDEX"
          arduino-cli core install "esp32:esp32@$ARDUINO_CORE_VERSION" \
            --additional-urls "$ESP32_PACKAGE_INDEX"
          arduino-cli lib update-index
          arduino-cli lib install \
            "GFX Library for Arduino@$ARDUINO_GFX_VERSION" \
            "lvgl@$LVGL_VERSION"
      - name: Compile for ESP32-P4
        shell: bash
        run: |
          arduino-cli compile \
            --fqbn "$ARDUINO_FQBN" \
            --library examples/arduino/libraries/Waveshare_ESP32_P4_4B_Display \
            --warnings all \
            "${{ matrix.sketch }}"
