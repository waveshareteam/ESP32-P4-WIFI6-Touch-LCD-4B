name: Firmware Build

on:
  pull_request:
    paths:
      - "firmware/brookesia/**"
      - "!firmware/brookesia/**/*.md"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:
    inputs:
      firmware:
        description: "Maintained firmware surface to build"
        required: true
        default: "brookesia"
        type: choice
        options:
          - brookesia

permissions:
  contents: read

concurrency:
  group: firmware-${{ inputs.firmware || 'brookesia' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    name: firmware/${{ inputs.firmware || 'brookesia' }} (v5.5.5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build maintained firmware for ESP32-P4
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C "firmware/${{ inputs.firmware || 'brookesia' }}" set-target esp32p4
          idf.py -C "firmware/${{ inputs.firmware || 'brookesia' }}" build
